name: Import Saint Protocol source
on:
  push:
    branches: [main]
    paths: ['.source/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore application source
        run: |
          cat .source/part-*.txt | base64 --decode | tar -xJf -
          rm -rf .source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Saint Protocol v0.4 source" || true
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
